[project]
name = "bot-detector"
version = "0.1.0"
description = "Самообучающийся детектор ботов в веб-трафике — проект курса ML System Design"
readme = "README.md"
license = "MIT"
authors = [{ name = "Vladislav Moiseenkov" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_detector"]

# ---------- ruff: линтер + форматер ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # pathlib вместо os.path
    "PL",       # pylint
    "PERF",     # perflint
    "NPY",      # numpy
    "PD",       # pandas-vet
    "T20",      # забытые print
    "RUF",
]
ignore = [
    # Кириллица в строках, докстрингах и комментариях — норма для проекта,
    # а не «подозрительные юникод-символы»
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"notebooks/**" = ["T201", "PLR2004", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot_detector"]

[tool.ruff.format]
docstring-code-format = true

# ---------- mypy ----------

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# ---------- pytest ----------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
