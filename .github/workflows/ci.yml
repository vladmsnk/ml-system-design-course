name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev -e .

      # no-commit-to-branch защищает только локальные коммиты, в CI он бы падал на push в main
      - name: pre-commit (ruff, mypy, базовые проверки)
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: pytest
